# Local dev stores only. Production uses Supabase Postgres + Qdrant Cloud (see PLAN.md).
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the data)
services:
  postgres:
    image: postgres:17
    container_name: scout-postgres
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_dev_only
      POSTGRES_DB: research_scout
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d research_scout"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: scout-qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:

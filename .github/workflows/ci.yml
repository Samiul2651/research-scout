# Build + test on every push and PR. On main, after tests pass: build the Docker image, then deploy to Render.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Real Postgres for the Infra tests (traces, daily spend, settings).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Real Qdrant for the vector store test.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334

    env:
      TEST_DATABASE_URL: postgresql://scout:scout_ci@localhost:5432/postgres
      TEST_QDRANT_URL: http://localhost:6334
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ResearchScout.slnx

      - name: Build
        run: dotnet build ResearchScout.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ResearchScout.slnx --no-build -c Release --verbosity normal

  docker:
    # Proves the Dockerfile still builds (the free host builds the same file).
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t research-scout:ci .

  deploy:
    # Only on main, only after tests and the image build pass.
    needs: [build-test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered."
